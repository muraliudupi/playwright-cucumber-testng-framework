name: Playwright & Appium Enterprise Automation Pipeline

on:
  push:
    branches: [ main, master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags to filter test execution (applies to the test suite)'
        required: false
        default: ''

      environment:
        type: choice
        description: 'Target environment'
        options:
          - staging
          - qa
          - dev
          - prod
        default: 'staging'


permissions:
  contents: read
  actions: write


jobs:
  automation-execution:

    name: Test Suite

    runs-on: ubuntu-latest

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers


    steps:

      # =========================================================
      # CHECKOUT SOURCE CODE
      # =========================================================

      - name: Checkout Source Code Baseline
        uses: actions/checkout@v7


      # =========================================================
      # JAVA SETUP
      # =========================================================

      - name: Setup Java Development Kit Environment (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'


      # =========================================================
      # GRADLE
      # =========================================================

      - name: Validate Gradle Wrapper Execution Permissions
        run: |
          chmod +x gradlew


      # =========================================================
      # APK PROVISIONING
      # =========================================================

      - name: Provision Application APK
        run: |

          mkdir -p src/test/resources/apps

          APK_PATH="src/test/resources/apps/mda-2.2.0-25.apk"


          if [ -f "$APK_PATH" ]; then

            echo "✅ APK already present in workspace."
            echo "APK_EXISTS=true" >> "$GITHUB_ENV"


          elif [ -z "${{ secrets.APK_DOWNLOAD_URL }}" ]; then

            echo "⚠️ APK not in workspace and APK_DOWNLOAD_URL secret is not set — skipping mobile test execution."
            echo "APK_EXISTS=false" >> "$GITHUB_ENV"


          else

            HTTP_STATUS=$(curl -sSL \
              -w "%{http_code}" \
              -o "$APK_PATH" \
              "${{ secrets.APK_DOWNLOAD_URL }}" || echo "000")


            if [ "$HTTP_STATUS" = "200" ] && [ -s "$APK_PATH" ]; then

              echo "✅ APK downloaded successfully from external source (HTTP $HTTP_STATUS)."
              echo "APK_EXISTS=true" >> "$GITHUB_ENV"


            else

              echo "⚠️ WARNING: APK download failed (HTTP $HTTP_STATUS). Falling back to Web-only execution."

              rm -f "$APK_PATH"

              echo "APK_EXISTS=false" >> "$GITHUB_ENV"

            fi
          fi


      # =========================================================
      # PLAYWRIGHT CACHE RESTORE
      # =========================================================

      - name: Restore Playwright Browser Cache
        uses: actions/cache/restore@v5
        id: playwright-cache
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('build.gradle') }}


      # =========================================================
      # PLAYWRIGHT BROWSER INSTALLATION
      # =========================================================

      - name: Install Playwright Browsers (Java Native)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |

          echo "Playwright browser cache miss - installing browsers..."

          ./gradlew installPlaywrightBrowsers --no-daemon


      # =========================================================
      # NODE.JS & APPIUM
      # =========================================================

      - name: Setup Node.js & Install Appium
        if: env.APK_EXISTS == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false


      - name: Install Appium & Drivers
        if: env.APK_EXISTS == 'true'
        run: |

          npm install -g appium

          appium driver install uiautomator2

          appium --port 4723 --allow-insecure=uiautomator2:adb_shell > appium.log 2>&1 &


      # =========================================================
      # KVM CONFIGURATION
      # =========================================================

      - name: Enable KVM group perms
        if: env.APK_EXISTS == 'true'
        run: |

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules

          sudo udevadm trigger --name-match=kvm


      # =========================================================
      # ANDROID EMULATOR
      # =========================================================

      - name: Boot Android Emulator
        if: env.APK_EXISTS == 'true'
        continue-on-error: true
        id: emulator_boot
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DB_PASSWORD: ${{ secrets.ENTERPRISE_DB_PASSWORD }}
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: bash .github/scripts/boot-emulator.sh


      # =========================================================
      # EXECUTE TEST SUITE
      # =========================================================

      - name: Execute Test Suite
        continue-on-error: true
        id: test_execution
        env:
          TAGS: "${{ github.event.inputs.tags != '' && github.event.inputs.tags || '(@web or @mobile) and @login' }}"
          ENV_NAME: "${{ github.event.inputs.environment || 'staging' }}"
          DB_PASSWORD: ${{ secrets.ENTERPRISE_DB_PASSWORD }}

        run: |

          mkdir -p build/reports/extent
          mkdir -p build/reports/cucumber

          echo "Executing TestNG suite from testng.xml..."

          echo "Cucumber tags: $TAGS"

          echo "Environment: $ENV_NAME"


          xvfb-run --auto-servernum ./gradlew test \
            "-Dcucumber.filter.tags=$TAGS" \
            "-Denv=$ENV_NAME" \
            --no-daemon


      # =========================================================
      # PUBLISH AUTOMATION REPORTS
      # =========================================================

      - name: Publish Automation Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Automation-Report

          path: |
            build/reports/cucumber/*.html
            build/reports/cucumber/*.json
            build/reports/extent/*.html
            build/reports/traces/*.zip
            build/reports/logs/*.log

          if-no-files-found: ignore

          retention-days: 14


      # =========================================================
      # PARSE CUCUMBER JSON REPORT RESULTS
      # =========================================================

      - name: Parse Cucumber JSON Report Results
        if: always()
        id: report_parser
        run: |

          JSON_FILES=$(find build/reports/cucumber -name "*.json" 2>/dev/null)


          # =======================================================
          # JSON REPORT FOUND
          # =======================================================

          if [ -n "$JSON_FILES" ]; then

            echo "Found Cucumber JSON report(s):"

            echo "$JSON_FILES"


            # =====================================================
            # PARSE SCENARIO RESULTS
            # =====================================================

            RESULT=$(echo "$JSON_FILES" | xargs jq -s '
              [.[][] | .elements[]? | select(.type == "scenario")] as $scenarios

              | ($scenarios | map(
                  (.steps // []) as $steps
                  | (.before // []) as $beforeHooks
                  | (.after // []) as $afterHooks

                  | if (
                      ($steps | any(.result.status == "failed"))
                      or ($beforeHooks | any(.result.status == "failed"))
                      or ($afterHooks | any(.result.status == "failed"))
                    ) then
                      "failed"

                    elif ($steps | any(
                      .result.status == "skipped"
                      or .result.status == "pending"
                      or .result.status == "undefined"
                      or .result.status == "ambiguous"
                    )) then
                      "skipped"

                    else
                      "passed"

                    end
                )) as $statuses

              | {
                  total: ($statuses | length),
                  passed: ($statuses | map(select(. == "passed")) | length),
                  failed: ($statuses | map(select(. == "failed")) | length),
                  skipped: ($statuses | map(select(. == "skipped")) | length)
                }
            ')


            # =====================================================
            # EXTRACT COUNTS
            # =====================================================

            TOTAL_SCENARIOS=$(echo "$RESULT" | jq -r '.total')

            FAILED_SCENARIOS=$(echo "$RESULT" | jq -r '.failed')

            PASSED_SCENARIOS=$(echo "$RESULT" | jq -r '.passed')

            SKIPPED_SCENARIOS=$(echo "$RESULT" | jq -r '.skipped')


            # =====================================================
            # DISPLAY RESULTS
            # =====================================================

            echo "========================================="

            echo "CUCUMBER SCENARIO RESULTS"

            echo "========================================="

            echo "Total Scenarios:   $TOTAL_SCENARIOS"

            echo "Passed Scenarios:  $PASSED_SCENARIOS"

            echo "Failed Scenarios:  $FAILED_SCENARIOS"

            echo "Skipped Scenarios: $SKIPPED_SCENARIOS"

            echo "========================================="


            # =====================================================
            # STATUS DETERMINATION
            #
            # Priority:
            #
            # 1. No scenarios matched
            # 2. Failed
            # 3. Skipped + Passed
            # 4. Skipped only
            # 5. Passed
            # =====================================================

            if [ "$TOTAL_SCENARIOS" -eq 0 ]; then

              STATUS_TEXT="⚠️ WARNING (0 Scenarios Matched — check Cucumber tags or report parsing)"

              BUILD_STATUS="FAILED"


            elif [ "$FAILED_SCENARIOS" -gt 0 ]; then

              if [ "$FAILED_SCENARIOS" -eq 1 ]; then

                STATUS_TEXT="❌ FAILED (1 Scenario Failed)"

              else

                STATUS_TEXT="❌ FAILED ($FAILED_SCENARIOS Scenarios Failed)"

              fi

              BUILD_STATUS="FAILED"


            elif [ "$SKIPPED_SCENARIOS" -gt 0 ]; then


              # ===================================================
              # SKIPPED + PASSED
              # ===================================================

              if [ "$PASSED_SCENARIOS" -gt 0 ]; then


                if [ "$SKIPPED_SCENARIOS" -eq 1 ] && [ "$PASSED_SCENARIOS" -eq 1 ]; then

                  STATUS_TEXT="⚠️ SKIPPED (1 Scenario Skipped) & PASSED (1 Scenario Passed)"


                elif [ "$SKIPPED_SCENARIOS" -gt 1 ] && [ "$PASSED_SCENARIOS" -eq 1 ]; then

                  STATUS_TEXT="⚠️ SKIPPED ($SKIPPED_SCENARIOS Scenarios Skipped) & PASSED (1 Scenario Passed)"


                elif [ "$SKIPPED_SCENARIOS" -eq 1 ] && [ "$PASSED_SCENARIOS" -gt 1 ]; then

                  STATUS_TEXT="⚠️ SKIPPED (1 Scenario Skipped) & PASSED ($PASSED_SCENARIOS Scenarios Passed)"


                else

                  STATUS_TEXT="⚠️ SKIPPED ($SKIPPED_SCENARIOS Scenarios Skipped) & PASSED ($PASSED_SCENARIOS Scenarios Passed)"

                fi


              # ===================================================
              # SKIPPED ONLY
              # ===================================================

              else

                if [ "$SKIPPED_SCENARIOS" -eq 1 ]; then

                  STATUS_TEXT="⚠️ SKIPPED (1 Scenario Skipped)"

                else

                  STATUS_TEXT="⚠️ SKIPPED ($SKIPPED_SCENARIOS Scenarios Skipped)"

                fi

              fi


              # Skipped scenarios do not fail the GitHub build.

              BUILD_STATUS="SUCCESS"


            # =====================================================
            # PASSED ONLY
            # =====================================================

            else

              STATUS_TEXT="✅ PASSED (All Scenarios Clean)"

              BUILD_STATUS="SUCCESS"

            fi


          # =======================================================
          # NO JSON REPORT FOUND
          # =======================================================

          else

            echo "❌ CRITICAL: No Cucumber JSON report(s) found."


            TOTAL_SCENARIOS=0

            FAILED_SCENARIOS=0

            PASSED_SCENARIOS=0

            SKIPPED_SCENARIOS=0


            STATUS_TEXT="⚠️ ERROR (No Report Found)"

            BUILD_STATUS="FAILED"

          fi


          # =======================================================
          # EXPORT VALUES
          # =======================================================

          echo "TOTAL_COUNT=$TOTAL_SCENARIOS" >> "$GITHUB_ENV"

          echo "PASSED_COUNT=$PASSED_SCENARIOS" >> "$GITHUB_ENV"

          echo "FAILED_COUNT=$FAILED_SCENARIOS" >> "$GITHUB_ENV"

          echo "SKIPPED_COUNT=$SKIPPED_SCENARIOS" >> "$GITHUB_ENV"

          echo "EMAIL_STATUS=$STATUS_TEXT" >> "$GITHUB_ENV"

          echo "BUILD_STATUS=$BUILD_STATUS" >> "$GITHUB_ENV"


      # =========================================================
      # PLAYWRIGHT CACHE DIAGNOSTIC
      # =========================================================

      - name: Inspect Playwright Browser Cache Before Save
        if: always()
        run: |

          echo "========================================="

          echo "PLAYWRIGHT CACHE DIAGNOSTIC"

          echo "========================================="

          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"


          if [ -d "$PLAYWRIGHT_BROWSERS_PATH" ]; then

            echo "✅ Browser directory exists."

            echo "Directory size:"

            du -sh "$PLAYWRIGHT_BROWSERS_PATH"

            echo "Contents:"

            find "$PLAYWRIGHT_BROWSERS_PATH" \
              -maxdepth 2 \
              -type d \
              | head -50

          else

            echo "❌ Browser directory does NOT exist."

            exit 1

          fi


      # =========================================================
      # SAVE PLAYWRIGHT CACHE
      # =========================================================

      - name: Save Playwright Browser Cache
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('build.gradle') }}


      # =========================================================
      # CHECK EXTENT REPORT
      # =========================================================

      - name: Check if Extent Report Exists
        if: always()
        id: check_extent
        run: |

          REPORT_PATH="build/reports/extent/ExtentReport.html"


          if [ -f "$REPORT_PATH" ]; then

            echo "✅ Extent Report found: $REPORT_PATH"

            echo "EXTENT_EXISTS=true" >> "$GITHUB_ENV"

            echo "ATTACHMENT_PATH=$REPORT_PATH" >> "$GITHUB_ENV"

          else

            echo "⚠️ Extent Report not found: $REPORT_PATH"

            echo "EXTENT_EXISTS=false" >> "$GITHUB_ENV"

            echo "ATTACHMENT_PATH=" >> "$GITHUB_ENV"

          fi


      # =========================================================
      # SEND EMAIL REPORT
      # =========================================================

      - name: Send Email Report
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}


          subject: "Automation Results: ${{ env.EMAIL_STATUS }} | ${{ github.repository }} (Build #${{ github.run_number }})"


          to: ${{ vars.QA_NOTIFICATION_EMAIL || 'qamurali@outlook.com' }}


          from: Automation Framework GitHub <${{ secrets.MAIL_USERNAME }}>


          body: |
            Hi Team,

            The automation test execution has completed.

            =========================================
            📊 EXECUTION SUMMARY
            =========================================
            • Status:            ${{ env.EMAIL_STATUS }}
            • Total Scenarios:   ${{ env.TOTAL_COUNT }}
            • Passed Scenarios:  ${{ env.PASSED_COUNT }}
            • Failed Scenarios:  ${{ env.FAILED_COUNT }}
            • Skipped Scenarios: ${{ env.SKIPPED_COUNT }}
            =========================================

            - Repository:   ${{ github.repository }}
            - Branch:       ${{ github.ref_name }}
            - Triggered By: ${{ github.actor }}
            - Action Link:  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ${{ env.EXTENT_EXISTS == 'true' && 'Please find the interactive ExtentReport.html attached to this email for full stack traces.' || '⚠️ Note: Interactive ExtentReport.html was not generated.' }}

            Regards,
            QA Automation


          attachments: ${{ env.ATTACHMENT_PATH }}


      # =========================================================
      # ENFORCE BUILD FAILURE
      # =========================================================

      - name: Enforce Build Failure on Test Failures
        if: always()
        run: |

          if [ "${{ env.BUILD_STATUS }}" = "FAILED" ]; then

            echo "Automation tests failed. Marking GitHub build as failed."

            exit 1

          fi