name: Playwright & Appium Enterprise Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags to filter test execution'
        required: false
        default: '(@mobile or @web) and @login'
      environment:
        type: choice
        description: 'Target environment'
        options:
          - staging
          - qa
          - dev
          - prod
        default: 'staging'
      run_mobile:
        type: boolean
        description: 'Check to boot Android emulator and run Appium tests'
        default: true

permissions:
  contents: read

jobs:
  automation-execution:
    name: Test Suite
    runs-on: macos-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

    steps:
      - name: Checkout Source Code Baseline
        uses: actions/checkout@v4

      - name: Setup Java Development Kit Environment (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Gradle Wrapper Execution Permissions
        run: chmod +x gradlew

      - name: Stage Application APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_mobile == true }}
        run: |
          if [ -f "src/test/resources/apps/mda-2.2.0-25.apk" ]; then
            echo "✅ APK successfully verified in workspace."
            echo "APK_EXISTS=true" >> $GITHUB_ENV
          else
            echo "⚠️ WARNING: APK file missing! Falling back to Web test execution."
            echo "APK_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/build.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers (Java Native)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          ./gradlew installPlaywrightBrowsers --no-daemon || npx playwright install chromium

      - name: Setup Node.js & Install Appium
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.run_mobile == true) && env.APK_EXISTS == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appium & Drivers
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.run_mobile == true) && env.APK_EXISTS == 'true' }}
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium --port 4723 > appium.log 2>&1 &

      - name: Boot Android Emulator & Execute Tests
        if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.run_mobile == true) && env.APK_EXISTS == 'true' }}
        continue-on-error: true
        id: test_execution_mobile
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TAGS: "${{ github.event.inputs.tags != '' && github.event.inputs.tags || '(@mobile or @web) and @login' }}"
          ENV_NAME: "${{ github.event.inputs.environment || 'staging' }}"
          DB_PASSWORD: ${{ secrets.ENTERPRISE_DB_PASSWORD }}
        with:
          api-level: 34
          target: default
          arch: arm64-v8a
          profile: Pixel_6a
          ram-size: 4096M
          disable-animations: true
          script: |
            # 1. Read device pool from properties file (ignoring commented lines)
            CONFIG_FILE="src/test/resources/config/config.properties"
            DEVICE_POOL=$(grep -E "^mobile\.local\.device\.pool=" "$CONFIG_FILE" | cut -d'=' -f2 | tr -d ' \r')
            export MOBILE_LOCAL_DEVICE_POOL="$DEVICE_POOL"
            
            echo "Parsed Device Pool from Config: $MOBILE_LOCAL_DEVICE_POOL"
            
            # Split comma-separated emulator names into array
            IFS=',' read -r -a EMULATOR_LIST <<< "$MOBILE_LOCAL_DEVICE_POOL"
            
            # 2. Boot each emulator defined in the pool dynamically
            for DEVICE in "${EMULATOR_LIST[@]}"; do
               # Extract port number from device ID (e.g., emulator-5554 -> 5554)
              PORT=$(echo "$DEVICE" | sed -E 's/.*-([0-9]+)/\1/')
              AVD_NAME="Pixel_6a_${PORT}"
            
              # Check if device is already online (reactivecircus action boots the primary device automatically on 5554)
              if $ANDROID_HOME/platform-tools/adb devices | grep -q "$DEVICE"; then
                echo "✅ Primary Emulator $DEVICE is already running."
              else
                echo "🚀 Booting background emulator $DEVICE on port $PORT..."
                echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n "$AVD_NAME" -k "system-images;android-34;default;arm64-v8a" --force
                $ANDROID_HOME/emulator/emulator -avd "$AVD_NAME" -port "$PORT" -no-window -no-audio -no-snapshot > /dev/null 2>&1 &
            
                $ANDROID_HOME/platform-tools/adb -s "$DEVICE" wait-for-device
                while [ "$($ANDROID_HOME/platform-tools/adb -s "$DEVICE" shell getprop sys.boot_completed 2>&1 | tr -d '\r')" != "1" ]; do
                  sleep 3
                done
                echo "✅ Emulator $DEVICE booted successfully!"
              fi
            done
            
            echo "List of connected ADB devices:"
            $ANDROID_HOME/platform-tools/adb devices
            
            # 3. Execute Mobile and Web Tests with TestNG parallel thread runner
            ./gradlew clean test "-Dcucumber.filter.tags=$TAGS" "-Denv=$ENV_NAME" --no-daemon

      - name: Execute Web Tests
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_mobile == false }}
        continue-on-error: true
        id: test_execution_web
        env:
          TAGS: "'@web and @login'"
          ENV_NAME: "${{ github.event.inputs.environment || 'staging' }}"
          DB_PASSWORD: ${{ secrets.ENTERPRISE_DB_PASSWORD }}
        run: |
          ./gradlew clean test "-Dcucumber.filter.tags=$TAGS" "-Denv=$ENV_NAME" --no-daemon

      - name: Publish Automation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Report
          path: |
            build/reports/cucumber/*.html
            build/reports/extent/ExtentReport.html
            build/reports/traces/*.zip
            build/reports/logs/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Parse Cucumber JSON Report Results
        if: always()
        id: report_parser
        run: |
          JSON_FILES=$(find build/reports/cucumber -name "*.json" 2>/dev/null)

          if [ -n "$JSON_FILES" ]; then
            echo "Found Cucumber JSON report(s):"
            echo "$JSON_FILES"

            RESULT=$(echo "$JSON_FILES" | xargs jq -s '
              [.[][] | .elements[]? | select(.type == "scenario")] as $scenarios
              | ($scenarios | map(
                  (.steps // []) as $steps
                  | if ($steps | any(.result.status == "failed")) then "failed"
                    elif ($steps | any(.result.status == "skipped" or .result.status == "pending" or .result.status == "undefined" or .result.status == "ambiguous")) then "skipped"
                    else "passed"
                    end
                )) as $statuses
              | { total: ($statuses | length),
                  passed: ($statuses | map(select(. == "passed")) | length),
                  failed: ($statuses | map(select(. == "failed")) | length),
                  skipped: ($statuses | map(select(. == "skipped")) | length) }
            ')

            TOTAL_SCENARIOS=$(echo "$RESULT" | jq -r '.total')
            FAILED_SCENARIOS=$(echo "$RESULT" | jq -r '.failed')
            PASSED_SCENARIOS=$(echo "$RESULT" | jq -r '.passed')
            SKIPPED_SCENARIOS=$(echo "$RESULT" | jq -r '.skipped')

            if [ "$FAILED_SCENARIOS" -gt 0 ]; then
              STATUS_TEXT="❌ FAILED ($FAILED_SCENARIOS Scenarios Failed)"
              BUILD_STATUS="FAILED"
            else
              STATUS_TEXT="✅ PASSED (All Scenarios Clean)"
              BUILD_STATUS="SUCCESS"
            fi
          else
            echo "❌ CRITICAL: No Cucumber JSON report(s) found."
            TOTAL_SCENARIOS=0
            FAILED_SCENARIOS=0
            PASSED_SCENARIOS=0
            SKIPPED_SCENARIOS=0
            STATUS_TEXT="⚠️ ERROR (No Report Found)"
            BUILD_STATUS="FAILED"
          fi

          echo "TOTAL_COUNT=$TOTAL_SCENARIOS" >> $GITHUB_ENV
          echo "PASSED_COUNT=$PASSED_SCENARIOS" >> $GITHUB_ENV
          echo "FAILED_COUNT=$FAILED_SCENARIOS" >> $GITHUB_ENV
          echo "SKIPPED_COUNT=$SKIPPED_SCENARIOS" >> $GITHUB_ENV
          echo "EMAIL_STATUS=$STATUS_TEXT" >> $GITHUB_ENV
          echo "BUILD_STATUS=$BUILD_STATUS" >> $GITHUB_ENV

      - name: Check if Extent Report Exists
        if: always()
        id: check_extent
        run: |
          if [ -f "build/reports/extent/ExtentReport.html" ]; then
            echo "EXTENT_EXISTS=true" >> $GITHUB_ENV
            echo "ATTACHMENT_PATH=build/reports/extent/ExtentReport.html" >> $GITHUB_ENV
          else
            echo "EXTENT_EXISTS=false" >> $GITHUB_ENV
            echo "ATTACHMENT_PATH=" >> $GITHUB_ENV
            echo "⚠️ WARNING: ExtentReport.html was not generated due to a compilation or early framework failure."
          fi

      - name: Send Email Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "Automation Results: ${{ env.EMAIL_STATUS }} | ${{ github.repository }} (Build #${{ github.run_number }})"
          to: ${{ vars.QA_NOTIFICATION_EMAIL || 'qamurali@outlook.com' }}
          from: Automation Framework GitHub <${{ secrets.MAIL_USERNAME }}>
          body: |
            Hi Team,
            
            The automation test execution has completed.
            
            =========================================
            📊 EXECUTION SUMMARY
            =========================================
            • Status:            ${{ env.EMAIL_STATUS }}
            • Total Scenarios:   ${{ env.TOTAL_COUNT }}
            • Passed Scenarios:  ${{ env.PASSED_COUNT }}
            • Failed Scenarios:  ${{ env.FAILED_COUNT }}
            • Skipped Scenarios: ${{ env.SKIPPED_COUNT }}
            =========================================
            
            - Repository:   ${{ github.repository }}
            - Branch:       ${{ github.ref_name }}
            - Triggered By: ${{ github.actor }}
            - Action Link:  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ${{ env.EXTENT_EXISTS == 'true' && 'Please find the interactive Extent Report attached to this email for full stack traces.' || '⚠️ Note: Interactive Extent Report attachment is missing because the build cycle was cut short.' }}
            
            Regards,
            QA Automation

          attachments: ${{ env.ATTACHMENT_PATH }}

      - name: Enforce Build Failure on Test Failures
        if: always()
        run: |
          if [ "${{ env.BUILD_STATUS }}" = "FAILED" ]; then
            echo "Automation tests failed. Marking GitHub build as failed."
            exit 1
          fi